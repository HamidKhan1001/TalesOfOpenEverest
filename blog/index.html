---
layout: default
title: Blog
permalink: /blog/
---
<div class="hero">
  <p class="kicker">In order, no skipping the messy parts</p>
  <h1>Blog</h1>
</div>

<ul class="post-list">
  {% for post in site.posts %}
  <li>
    <a href="{{ post.url | relative_url }}" class="post-list-title">{{ post.title }}</a>
    <span class="post-list-date">{{ post.date | date: "%B %-d, %Y" }}</span>
    <p class="post-list-excerpt">{{ post.excerpt | strip_html | truncatewords: 32 }}</p>
  </li>
  {% endfor %}
</ul>
