---
layout: default
title: Blog
permalink: /blog/
---
<div class="hero">
  <span class="kicker">no skipping the parts that make me look bad</span>
  <h1>Blog</h1>
</div>

<ul class="post-list">
  {% for post in site.posts %}
  <li>
    <span class="post-list-date">{{ post.date | date: "%b %d" }}</span>
    <a href="{{ post.url | relative_url }}" class="post-list-title">{{ post.title }}</a>
  </li>
  {% endfor %}
</ul>
