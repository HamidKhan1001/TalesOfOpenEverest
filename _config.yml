title: Tales of OpenEverest
description: >-
  A real record of learning Go and open source by contributing to OpenEverest,
  one issue and one pull request at a time.
author: Hamid Khan
github_username: HamidKhan1001
linkedin_url: "https://www.linkedin.com/in/hamid-naeem-khan-278413402/"
url: "https://HamidKhan1001.github.io"
baseurl: "/TalesOfOpenEverest"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate-v2

collections:
  blog:
    output: true

pagination:
  enabled: true
  collection: blog
  per_page: 5
  sort_field: date
  sort_reverse: true
  permalink: /blog/page/:num/
  title: ":title, page :num"

feed:
  collections:
    blog:
      output: true

defaults:
  - scope:
      path: ""
      type: blog
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
