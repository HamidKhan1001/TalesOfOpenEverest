title: Tales of OpenEverest
description: >-
  A real record of learning Go and open source by contributing to OpenEverest,
  one issue and one pull request at a time.
author: Hamid Khan
github_username: HamidKhan1001
url: "https://HamidKhan1001.github.io"
baseurl: "/TalesOfOpenEverest"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag

collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
